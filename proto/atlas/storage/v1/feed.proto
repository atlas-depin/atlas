syntax = "proto3";

package atlas.storage.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "atlas/x/storage/types";

// Feed holds the latest data for a named price feed.
message Feed {
  string owner = 1;
  string data = 2;
  google.protobuf.Timestamp last_update = 3 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
  string name = 4;
}
