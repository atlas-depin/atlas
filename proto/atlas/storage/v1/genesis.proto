syntax = "proto3";

package atlas.storage.v1;

import "amino/amino.proto";
import "atlas/storage/v1/feed.proto";
import "atlas/storage/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "atlas/x/storage/types";

// GenesisState defines the storage module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // feeds defines the feeds present at genesis. The built-in $ATL feed is
  // always ensured to exist by InitGenesis regardless of this list.
  repeated Feed feeds = 2 [ (gogoproto.nullable) = false ];
}
