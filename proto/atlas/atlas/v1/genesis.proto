syntax = "proto3";
package atlas.atlas.v1;

import "amino/amino.proto";
import "atlas/atlas/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "atlas/x/atlas/types";

// GenesisState defines the atlas module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
