syntax = "proto3";
package nebulix.storage.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "nebulix/x/storage/types";

// File defines the File message.
message Subscription {
  string subscriptionId = 1;
  string status = 2;
  google.protobuf.Timestamp start = 3 [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false ];
  google.protobuf.Timestamp end = 4 [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  int64 spaceAvailable = 5;
  int64 spaceUsed = 6;
  string address = 7;
}