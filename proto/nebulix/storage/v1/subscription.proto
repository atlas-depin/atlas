syntax = "proto3";
package nebulix.storage.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "nebulix/x/storage/types";

// File defines the File message.
message StorageSubscription {
  google.protobuf.Timestamp start = 1 [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false ];
  google.protobuf.Timestamp end = 2 [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false ];
  string status = 3;
  int64 spaceAvailable = 4;
  int64 spaceUsed = 5;
  int64 extraSpaceUsed = 6;
  string credits = 7 [ (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false ];
}