syntax = "proto3";
package nebulix.storage.v1;

option go_package = "nebulix/x/storage/types";

// File defines the File message.
message File {
  string file_id = 1;
  string merkle = 2;
  string owner = 3;
  string subscription = 4;
  repeated string providers = 5;
  int64 file_size = 6;
  int64 start = 7;
  int64 replicas = 8;
  int64 last_challenged_height = 9;
}

message StagedFile {
    repeated string providers = 1;
    string creator = 2;
    int64 size = 3;
    int64 start = 4;
}